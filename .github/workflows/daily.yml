name: Atualizar radar

on:
  schedule:
    - cron: "17 8 * * *"
      timezone: "America/Sao_Paulo"
  workflow_dispatch:

concurrency:
  group: concursos-watch-daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Atualizar dados e página
        run: python monitor.py

      - name: Executar testes
        run: python -m pytest

      - name: Validar JSON e HTML
        run: |
          python -m json.tool data/vacancies.json > /dev/null
          python -m json.tool data/seen.json > /dev/null
          python -m json.tool data/run_history.json > /dev/null
          test -s docs/index.html
          grep -q '<meta name="viewport"' docs/index.html

      - name: Empacotar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Commitar somente quando houver alterações
        run: |
          if git diff --quiet -- data docs; then
            echo "Nenhuma alteração para publicar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git commit -m "chore: update concurso radar"
          git push

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
